openapi: 3.1.0
info:
  title: LeagueApp — API REST interne
  version: 0.1.0
  description: |
    API exposée par le serveur SvelteKit (routes `+server.ts`) et consommée uniquement par
    l'interface de LeagueApp. Seul ce serveur appelle l'API Riot (clé dans `X-Riot-Token`,
    jamais transmise au navigateur).

    Conventions :
    - Toutes les réponses sont en JSON. Toute erreur renvoie `{ "error": ApiError }`.
    - Un Riot ID dans une URL s'écrit `{gameName}-{tagLine}` (découpé sur le dernier `-`),
      chaque partie encodée avec `encodeURIComponent`. Ex. `Faker-KR1`, `Le%20Joueur-EUW`.
    - Les dates sont en ISO 8601 (UTC).
servers:
  - url: http://localhost:5173
    description: Développement local (`npm run dev`)
  - url: http://localhost:3000
    description: Build local (`node build`)

paths:
  /api/players/{platform}/{riotId}:
    get:
      summary: Profil d'un joueur (FR-001 à FR-004)
      parameters:
        - $ref: '#/components/parameters/Platform'
        - $ref: '#/components/parameters/RiotId'
      responses:
        '200':
          description: Joueur trouvé
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlayerProfile' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /api/players/{platform}/{riotId}/matches:
    get:
      summary: Historique paginé de matchs, du plus récent au plus ancien (FR-005 à FR-008)
      parameters:
        - $ref: '#/components/parameters/Platform'
        - $ref: '#/components/parameters/RiotId'
        - name: start
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: count
          in: query
          schema: { type: integer, minimum: 1, maximum: 20, default: 20 }
      responses:
        '200':
          description: |
            Page de matchs. `hasMore` indique s'il est possible de charger la page suivante
            (FR-007). Une liste vide avec `start=0` = « Aucune partie récente ».
            Les matchs refusés par Riot (403/404) sont omis et comptés dans `skipped`.
          content:
            application/json:
              schema:
                type: object
                required: [matches, hasMore, skipped]
                properties:
                  matches:
                    type: array
                    items: { $ref: '#/components/schemas/MatchSummary' }
                  hasMore: { type: boolean }
                  skipped: { type: integer, minimum: 0 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /api/reference/{puuid}/analysis:
    parameters:
      - $ref: '#/components/parameters/ReferencePuuid'
    get:
      summary: État de l'analyse des 100 dernières parties (FR-012a, FR-012b)
      description: Interrogé chaque seconde par l'interface tant que `state = running`.
      responses:
        '200':
          description: État courant (`never` si aucune analyse n'existe)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnalysisStatus' }
    post:
      summary: Lance (ou relance, de façon incrémentale) l'analyse — bouton « Analyser mon historique »
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [platform]
              properties:
                platform: { $ref: '#/components/schemas/Platform' }
      responses:
        '202':
          description: Analyse démarrée en arrière-plan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnalysisStatus' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409':
          description: Une analyse est déjà en cours (`ANALYSIS_ALREADY_RUNNING`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/reference/{puuid}/encounters:
    parameters:
      - $ref: '#/components/parameters/ReferencePuuid'
    get:
      summary: Nombre de parties communes pour plusieurs joueurs — badges 👥 (FR-010a)
      parameters:
        - name: with
          in: query
          required: true
          description: PUUID séparés par des virgules (10 maximum)
          schema: { type: string }
      responses:
        '200':
          description: |
            Objet `{ puuid: nombre }`. Les joueurs jamais croisés sont absents.
            Aucun appel à Riot (calcul local sur l'analyse).
          content:
            application/json:
              schema:
                type: object
                required: [counts]
                properties:
                  counts:
                    type: object
                    additionalProperties: { type: integer, minimum: 1 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404':
          description: Analyse jamais lancée (`REFERENCE_NOT_ANALYZED`) — aucun badge (FR-016)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/reference/{puuid}/encounters/{otherPuuid}:
    parameters:
      - $ref: '#/components/parameters/ReferencePuuid'
      - name: otherPuuid
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Résumé et détail des parties communes avec un joueur (FR-010, FR-011, FR-013, FR-015)
      responses:
        '200':
          description: Résumé (éventuellement `total = 0`, ou `isSelf = true`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EncounterSummary' }
        '404':
          description: Analyse jamais lancée (`REFERENCE_NOT_ANALYZED`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

components:
  parameters:
    Platform:
      name: platform
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Platform' }
    RiotId:
      name: riotId
      in: path
      required: true
      description: '`{gameName}-{tagLine}` encodé'
      schema: { type: string }
    ReferencePuuid:
      name: puuid
      in: path
      required: true
      description: PUUID du compte de référence
      schema: { type: string }

  responses:
    BadRequest:
      description: '`INVALID_RIOT_ID`, `INVALID_PLATFORM` ou `INVALID_REQUEST`'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: '`PLAYER_NOT_FOUND`'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    RateLimited:
      description: '`RIOT_RATE_LIMITED` — en-tête `Retry-After` renseigné'
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unavailable:
      description: '`RIOT_UNAVAILABLE` ou `RIOT_API_KEY_INVALID`'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

  schemas:
    Platform:
      type: string
      enum: [euw1, eun1, tr1, ru, me1, na1, br1, la1, la2, kr, jp1, oc1, sg2, tw2, vn2]
      default: euw1

    PlayerProfile:
      type: object
      required: [puuid, gameName, tagLine, platform, profileIconUrl, summonerLevel]
      properties:
        puuid: { type: string }
        gameName: { type: string }
        tagLine: { type: string }
        platform: { $ref: '#/components/schemas/Platform' }
        profileIconUrl: { type: string, format: uri }
        summonerLevel: { type: integer }

    Outcome:
      type: string
      enum: [win, loss, remake]

    Participant:
      type: object
      required: [puuid, gameName, tagLine, isBot, championName, championIconUrl, side, kills, deaths, assists]
      properties:
        puuid: { type: [string, 'null'] }
        gameName: { type: [string, 'null'] }
        tagLine: { type: [string, 'null'] }
        isBot: { type: boolean }
        championName: { type: string }
        championIconUrl: { type: string, format: uri }
        side: { type: string, enum: [blue, red] }
        kills: { type: integer }
        deaths: { type: integer }
        assists: { type: integer }

    MatchSummary:
      type: object
      required: [matchId, queueLabel, playedAt, durationSeconds, player, outcome, teams]
      properties:
        matchId: { type: string }
        queueLabel: { type: string }
        playedAt: { type: string, format: date-time }
        durationSeconds: { type: integer }
        player: { $ref: '#/components/schemas/Participant' }
        outcome: { $ref: '#/components/schemas/Outcome' }
        teams:
          type: array
          minItems: 2
          maxItems: 2
          items:
            type: object
            required: [side, outcome, participants]
            properties:
              side: { type: string, enum: [blue, red] }
              outcome: { $ref: '#/components/schemas/Outcome' }
              participants:
                type: array
                items: { $ref: '#/components/schemas/Participant' }

    AnalysisStatus:
      type: object
      required: [state, processed, total, lastAnalyzedAt, analyzedCount, unavailableCount, oldestMatchAt, error]
      properties:
        state: { type: string, enum: [never, running, done, failed] }
        processed: { type: integer }
        total: { type: integer }
        lastAnalyzedAt: { type: [string, 'null'], format: date-time }
        analyzedCount: { type: integer }
        unavailableCount: { type: integer }
        oldestMatchAt: { type: [string, 'null'], format: date-time }
        error:
          oneOf:
            - $ref: '#/components/schemas/ApiError'
            - type: 'null'

    EncounterStats:
      type: object
      required: [games, wins, losses, remakes]
      properties:
        games: { type: integer }
        wins: { type: integer }
        losses: { type: integer }
        remakes: { type: integer }

    EncounterSummary:
      type: object
      required: [otherPuuid, isSelf, total, sameTeam, opponents, lastPlayedAt, games, period]
      properties:
        otherPuuid: { type: string }
        isSelf: { type: boolean }
        total: { type: integer }
        sameTeam: { $ref: '#/components/schemas/EncounterStats' }
        opponents: { $ref: '#/components/schemas/EncounterStats' }
        lastPlayedAt: { type: [string, 'null'], format: date-time }
        games:
          type: array
          items:
            type: object
            required: [matchId, playedAt, queueLabel, relation, referenceChampion, otherChampion, referenceOutcome]
            properties:
              matchId: { type: string }
              playedAt: { type: string, format: date-time }
              queueLabel: { type: string }
              relation: { type: string, enum: [same-team, opponent] }
              referenceChampion: { type: string }
              otherChampion: { type: string }
              referenceOutcome: { $ref: '#/components/schemas/Outcome' }
        period:
          type: object
          required: [analyzedCount, oldestMatchAt]
          properties:
            analyzedCount: { type: integer }
            oldestMatchAt: { type: [string, 'null'], format: date-time }

    ApiError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - INVALID_RIOT_ID
            - INVALID_PLATFORM
            - INVALID_REQUEST
            - PLAYER_NOT_FOUND
            - REFERENCE_NOT_ANALYZED
            - ANALYSIS_ALREADY_RUNNING
            - RIOT_RATE_LIMITED
            - RIOT_API_KEY_INVALID
            - RIOT_UNAVAILABLE
            - INTERNAL_ERROR
        message: { type: string, description: Texte français prêt à afficher }
        retryAfterSeconds: { type: integer }

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error: { $ref: '#/components/schemas/ApiError' }
